[package]
authors = [
  "Matt Butcher <matt.butcher@microsoft.com>",
  "Matthew Fisher <matt.fisher@microsoft.com>",
  "Radu Matei <radu.matei@microsoft.com>",
  "Taylor Thomas <taylor.thomas@microsoft.com>",
  "Brian Ketelsen <Brian.Ketelsen@microsoft.com>",
  "Brian Hardock <Brian.Hardock@microsoft.com>",
  "Ryan Levick <rylevick@microsoft.com>",
  "Kevin Flansburg <kevin.flansburg@gmail.com>",
  "Flavio Castelli <fcastelli@suse.com>",
]
description = "An OCI implementation in Rust"
documentation = "https://docs.rs/oci-client"
edition = "2021"
keywords = ["oci", "containers"]
license = "Apache-2.0"
name = "oci-client"
readme = "README.md"
repository = "https://github.com/oras-project/rust-oci-client"
version = "0.19.0"

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "blocking-get-manifest"
path = "examples/blocking-get-manifest/main.rs"
required-features = ["blocking"]

[[example]]
name = "blocking-pull-layer"
path = "examples/blocking-pull-layer/main.rs"
required-features = ["blocking"]

[features]
default = ["rustls-tls", "test-registry"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]
# Like `rustls-tls`, but without a bundled crypto provider. You must install
# a rustls `CryptoProvider` yourself before you build a `Client`, for example
# with `rustls::crypto::ring::default_provider().install_default()`.
rustls-tls-no-provider = ["reqwest/rustls-no-provider"]
hickory-dns = ["reqwest/hickory-dns"]
# Enables a synchronous client, `oci_client::blocking`, built as a thin
# wrapper around the async `Client`. It runs the async client on a
# dedicated background thread.
blocking = ["dep:tokio"]
# This features is used by tests that use docker to create a registry
test-registry = []

[dependencies]
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
http = "1.3"
http-auth = { version = "0.1", default-features = false }
http-body = "1"
http-body-util = "0.1"
oci-spec = "0.10"
olpc-cjson = "0.1"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "stream",
] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "io-util", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1", features = ['log'] }
unicase = "2.8"
url = "2"
web-time = "1"

# Gives `tokio::runtime` to the background thread of the blocking client
# (`blocking::background_runtime`).
#
# This dependency applies only to non-wasm32 targets. A wasm32 build
# cannot use the `blocking` feature. It has no OS threads, and `lib.rs`
# blocks that combination with a `compile_error!`. Wasm32 also lacks
# Tokio's `net` driver, which the background thread needs too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", optional = true, features = ["rt", "net", "time"] }

# The default transport on `wasm32-unknown-unknown` uses the Fetch API of the
# browser, see `transport::browser`. The condition is the one that reqwest uses
# to select its browser backend.
[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
futures-channel = { version = "0.3", features = ["sink"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
assert-json-diff = "2.0"
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
rstest = "0.27"
docker_credential = "1.3"
hmac = "0.13"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "aws-lc-rs",
  "http1",
  "native-tokio",
  "tls12",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
itertools = "0.15"
rustls = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# This should stay pinned here until testcontainers makes sure all of its deps using rustls are
# using the ring feature. Otherwise this fails to compile on Windows
testcontainers = { version = "0.28", features = ["blocking"] }
tokio = { version = "1", features = ["macros", "fs", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower-http = { version = "0.6", default-features = false, features = [
  "follow-redirect",
  "trace",
] }
